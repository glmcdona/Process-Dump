name: Publish tagged release

on:
  push:
    tags: ['v[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
  release:
    needs: build
    runs-on: windows-2022
    permissions:
      actions: read
      contents: write
    concurrency:
      group: publish-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Prepare allowlisted artifact bytes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: python -I .github\scripts\release_artifacts.py
      - name: Publish tested release binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          gh release create $env:RELEASE_VERSION release-binaries\pd32.exe release-binaries\pd64.exe release-binaries\provenance.json --verify-tag --title $env:RELEASE_VERSION --generate-notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
