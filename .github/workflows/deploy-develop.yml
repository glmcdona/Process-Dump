name: Publish development binaries

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
  release:
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Win32 Executable
          path: binaries\Win32
      - uses: actions/download-artifact@v4
        with:
          name: x64 Executable
          path: binaries\x64
      - name: Publish tested development binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          Move-Item binaries\Win32\pd.exe pd32.exe
          Move-Item binaries\x64\pd.exe pd64.exe
          gh release view Develop
          if ($LASTEXITCODE -eq 0) {
            gh release upload Develop pd32.exe pd64.exe --clobber
          } else {
            gh release create Develop pd32.exe pd64.exe --target $env:RELEASE_COMMIT --title Develop --prerelease --notes "Development binaries"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
