name: Release selected commit

on:
  workflow_dispatch:
    inputs:
      commit:
        type: string
        description: Commit SHA to build and release
        required: true
      version:
        type: string
        description: Release version (for example v2.2)
        required: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-2022
    steps:
      - name: Validate release inputs
        env:
          COMMIT: ${{ inputs.commit }}
          VERSION: ${{ inputs.version }}
        run: |
          if ($env:COMMIT -notmatch '^[0-9a-fA-F]{40}$') { throw "A full commit SHA is required" }
          if ($env:VERSION -notmatch '^v[0-9]+\.[0-9]+(\.[0-9]+)?$') { throw "Invalid release version" }
  build:
    needs: validate
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ inputs.commit }}
  release:
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Win32 Executable
          path: binaries\Win32
      - uses: actions/download-artifact@v4
        with:
          name: x64 Executable
          path: binaries\x64
      - name: Publish tested binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: |
          Move-Item binaries\Win32\pd.exe pd32.exe
          Move-Item binaries\x64\pd.exe pd64.exe
          gh release create $env:RELEASE_VERSION pd32.exe pd64.exe --target $env:RELEASE_COMMIT --title $env:RELEASE_VERSION --generate-notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
