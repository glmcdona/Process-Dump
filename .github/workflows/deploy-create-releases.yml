name: Release selected commit

on:
  workflow_dispatch:
    inputs:
      commit:
        type: string
        description: Commit SHA to build and release
        required: true
      version:
        type: string
        description: Release version (for example v3.0.0)
        required: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-2022
    steps:
      - name: Validate release inputs
        env:
          COMMIT: ${{ inputs.commit }}
          VERSION: ${{ inputs.version }}
        run: |
          if ($env:COMMIT -notmatch '^[0-9a-fA-F]{40}$') { throw "A full commit SHA is required" }
          if ($env:VERSION -notmatch '^v[0-9]+\.[0-9]+(\.[0-9]+)?$') { throw "Invalid release version" }
  build:
    needs: validate
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ inputs.commit }}
  release:
    needs: build
    runs-on: windows-2022
    permissions:
      actions: read
      contents: write
    concurrency:
      group: publish-${{ inputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Prepare allowlisted artifact bytes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: python -I .github\scripts\release_artifacts.py
      - name: Publish tested binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: |
          gh release create $env:RELEASE_VERSION release-binaries\pd32.exe release-binaries\pd64.exe release-binaries\provenance.json --target $env:RELEASE_COMMIT --title $env:RELEASE_VERSION --generate-notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
