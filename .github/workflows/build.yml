name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        platform: [Win32, x64]
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: microsoft/setup-msbuild@v2
      - name: Build application and unit tests
        run: msbuild pd.sln /m /v:minimal /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }}
      - name: Run unit tests
        run: |
          & ".\${{ matrix.platform }}\${{ matrix.configuration }}\pd_tests.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: matrix.configuration == 'Release'
        with:
          name: ${{ matrix.platform }} Executable
          path: .\${{ matrix.platform }}\Release\pd.exe
          if-no-files-found: error
