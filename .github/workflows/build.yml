name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        platform: [Win32, x64]
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2
      - name: Build application and unit tests
        run: msbuild pd.sln /m /v:minimal /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }}
      - name: Run unit tests
        run: |
          & ".\${{ matrix.platform }}\${{ matrix.configuration }}\pd_tests.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test CLI documentation, benchmark analysis and release artifact handling
        env:
          PD_TEST_EXE: .\${{ matrix.platform }}\${{ matrix.configuration }}\pd.exe
        run: python -m unittest discover -s tests -p "test_*.py"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.configuration == 'Release'
        with:
          name: ${{ matrix.platform }} Executable
          path: .\${{ matrix.platform }}\Release\pd.exe
          if-no-files-found: error
